name: github pages

on:
  push:
    branches:
      - master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Dependencies
        run: |
          cd client
          npm ci

      - name: Build WASM
        run: |
          cd wasm
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o ../client/public/newspews.wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ../client/public/

      - name: Build UI
        run: |
          cd client
          npm run build
          npm run export
          touch ./out/.nojekyll
          touch ./out/_next/.nojekyll
        env:
          BASE_URL: /newspews
          NEXT_PUBLIC_USE_GEO: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
